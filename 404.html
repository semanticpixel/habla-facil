<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>El Habla F&aacute;cil</title>
<style>
  :root { --paper: #FCFAF3; --ink: #060405; --muted: #6E6658; }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    padding: 2rem 1.5rem;
    display: grid;
    place-items: center;
    background: var(--paper);
    color: var(--ink);
    font: 400 17px/1.55 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  main { text-align: center; max-width: 28rem; }
  img { width: clamp(11rem, 45vw, 16rem); height: auto; display: block; margin: 0 auto; }
  p {
    margin: 2.25rem 0 0;
    font-style: italic;
    color: var(--muted);
    font-size: clamp(.95rem, 3.4vw, 1.05rem);
    text-wrap: balance;
  }
  .note { margin-top: .9rem; font-size: .85rem; }
  a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: .18em; }
</style>
</head>
<body>
  <main>
    <a href="/" aria-label="El Habla F&aacute;cil">
      <img src="assets/logo.svg" alt="habla f&aacute;cil">
    </a>
    <p>The most exclusive cocktail bar in San Francisco.</p>
    <p class="note">This page is not on the menu.</p>
  </main>
</body>
</html>
