name: Build and deploy the menu

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the deploy job needs to write Pages and mint an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Generates the menu page from menu.json and copies the published files
      # into _site/. Fails the build if menu.json or the rendered page is bad.
      - name: Build the site
        run: python3 tools/build-menu.py --out _site

      # Node ships on the runner; no setup step needed.
      - name: Test the tap-to-reveal script
        run: node tools/test-reveal.js

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  # Pull requests build and validate but never publish.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
